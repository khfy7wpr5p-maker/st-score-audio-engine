name: Audio Qualification Pages

on:
  push:
    branches:
      - onderozudogru/classical-guitar-qualification-harness
    paths:
      - "examples/physical-ios-validation/**"
      - "packages/contracts/**"
      - "packages/web/src/**"
      - "package.json"
      - "package-lock.json"
      - "vite.audio-qualification-pages.config.ts"
      - ".github/workflows/audio-qualification-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: audio-qualification-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build audio qualification lab
        run: npm run build:qualification:pages

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/audio-qualification-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
